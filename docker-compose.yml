services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: baton_local
      POSTGRES_DB: baton
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U baton -d baton"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
